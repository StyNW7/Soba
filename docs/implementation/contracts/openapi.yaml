  /v1/auth/callback:
    get:
      operationId: oidcCallback
      summary: oidcCallback
      description: Validate state and exactly one code or error outcome. On error,
        return only a fixed safe login-cancelled/failed UI state; never echo provider
        error_description. No session/profile is created on an error.
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: state
        in: query
        required: true
        schema: &id014
          type: string
          minLength: 32
          maxLength: 512
      - name: error
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      - name: error_description
        in: query
        required: false
        schema:
          type: string
          maxLength: 1000
      responses:
        '302':
          description: Success
          headers:
            Location:
              schema: &id017
                type: string
                format: uri
                maxLength: 2048
              description: Configured web URL or fixed mobile app link; never arbitrary
                caller URL.
