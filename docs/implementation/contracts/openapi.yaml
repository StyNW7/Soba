components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      description: SOBA opaque access token, 15 minute lifetime
    sessionCookie:
      type: apiKey
      in: cookie
      name: soba_session
    deviceBearer:
      type: http
      scheme: bearer
      description: Per-device operational credential
    bootstrapBearer:
      type: http
      scheme: bearer
      description: Per-device factory credential; claim confirmation only
    deletionReceipt:
      type: apiKey
      in: header
      name: X-Deletion-Receipt
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - unauthenticated
          - forbidden
          - not_found
          - invalid_request
          - version_conflict
          - idempotency_conflict
          - request_in_progress
          - rate_limited
          - dependency_unavailable
          - draft_expired
          - policy_blocked
          - claim_expired
          - device_owned
          - recipient_unavailable
          - invalid_state
          - unsupported_language
        message:
          type: string
          minLength: 0
          maxLength: 300
        request_id: *id001
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                minLength: 0
                maxLength: 100
              code:
                type: string
                minLength: 0
                maxLength: 60
            required:
            - field
            - code
          maxItems: 20
      required:
      - code
      - message
      - request_id
      - fields
    Profile:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        locale:
          type: string
          enum:
          - id-ID
          - en-US
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        roles:
          type: array
          items:
            type: string
            enum:
            - user
            - guardian
          maxItems: 2
          uniqueItems: true
        eligibility:
          type: string
          enum:
          - pending
          - allowed
          - blocked
        age_band:
          type: string
          enum:
          - under_18
          - 18_plus
          - unknown
        deleting: &id012
          type: boolean
        version: &id010
          type: integer
          minimum: 1
          maximum: 2147483647
        shared_phone: &id011
          type:
          - string
          - 'null'
          pattern: ^\+[1-9][0-9]{6,14}$
      required:
      - id
      - display_name
      - locale
      - timezone
      - roles
      - eligibility
      - age_band
      - deleting
      - version
      - shared_phone
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        locale:
          type: string
          enum:
          - id-ID
          - en-US
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        roles:
          type: array
          items:
            type: string
            enum:
            - user
            - guardian
          maxItems: 2
          uniqueItems: true
        age_band:
          type: string
          enum:
          - under_18
          - 18_plus
          - unknown
        version: *id010
        shared_phone: *id011
      required:
      - display_name
      - locale
      - timezone
      - roles
      - age_band
      - version
      - shared_phone
    Preferences:
      type: object
      additionalProperties: false
      properties:
        personality:
          type: string
          enum:
          - calm
          - friendly
          - encouraging
        voice:
          type: string
          enum:
          - marin
          - cedar
        listen_first: *id012
        memory_enabled: *id012
        version: *id010
      required:
      - personality
      - voice
      - listen_first
      - memory_enabled
      - version
    Policy:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 60
        speech_processing_text:
          type: string
          minLength: 1
          maxLength: 10000
        providers:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          maxItems: 8
        minimum_age:
          type: integer
          minimum: 0
          maximum: 120
        minor_enrollment_enabled: *id012
        retention_days:
          type: integer
          minimum: 1
          maximum: 365
        published_at: &id013
          type: string
          format: date-time
      required:
      - version
      - speech_processing_text
      - providers
      - minimum_age
      - minor_enrollment_enabled
      - retention_days
      - published_at
    ProcessingConsent:
      type: object
      additionalProperties: false
      properties:
        accepted: *id012
        policy_version:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - accepted
      - policy_version
    Device:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        created_at: *id013
        updated_at: *id013
        version: *id010
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum:
          - unpaired
          - online
          - offline
          - revoked
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        battery_percent:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        battery_reported_at:
          type:
          - string
          - 'null'
          format: date-time
        firmware_version:
          type: string
          minLength: 0
          maxLength: 40
        applied_preferences_version:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
      - id
      - created_at
      - updated_at
      - version
      - name
      - status
      - last_seen_at
      - battery_percent
      - battery_reported_at
      - firmware_version
      - applied_preferences_version
    ClaimCreate:
      type: object
      additionalProperties: false
      properties:
        device_id: *id001
      required:
      - device_id
    Claim:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        device_id: *id001
        challenge:
          type:
          - string
          - 'null'
          minLength: 32
          maxLength: 512
          description: Present only for a pending owner claim; null after confirmation
            or expiry.
        expires_at: *id013
        status:
          type: string
          enum:
          - pending
          - confirmed
          - expired
      required:
      - id
      - device_id
      - challenge
      - expires_at
      - status
    ClaimConfirm:
      type: object
      additionalProperties: false
      properties:
        challenge: *id014
      required:
      - challenge
    DeviceCredential:
      type: object
      additionalProperties: false
      properties:
        device_id: *id001
        credential: *id014
      required:
      - device_id
      - credential
    Heartbeat:
      type: object
      additionalProperties: false
      properties:
        battery_percent:
          type: integer
          minimum: 0
          maximum: 100
        firmware_version:
          type: string
          minLength: 1
          maxLength: 40
        applied_preferences_version:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
      - battery_percent
      - firmware_version
      - applied_preferences_version
    HeartbeatResult:
      type: object
      additionalProperties: false
      properties:
        server_time: *id013
        preferences:
          $ref: '#/components/schemas/Preferences'
        firmware_manifest_url:
          type:
          - string
          - 'null'
          format: uri
        voice_enabled: *id012
      required:
      - server_time
      - preferences
      - firmware_manifest_url
      - voice_enabled
    RenameDevice:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        version: *id010
      required:
      - name
      - version
    VoiceTicketRequest:
      type: object
      additionalProperties: false
      properties:
        device_id: *id001
        mode:
          type: string
          enum:
          - private
          - personal
      required:
      - mode
    VoiceTicket:
      type: object
      additionalProperties: false
      properties:
        ticket: *id014
        expires_at: *id013
        websocket_path:
          type: string
          enum:
          - /v1/voice
      required:
      - ticket
      - expires_at
      - websocket_path
    Session:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        device_id:
          type:
          - string
          - 'null'
          format: uuid
        started_at: *id013
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
          enum:
          - active
          - review
          - saved
          - discarded
          - expired
          - interrupted
        draft_expires_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - device_id
      - started_at
      - ended_at
      - state
      - draft_expires_at
    MemoryCandidate:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        text:
          type: string
          minLength: 1
          maxLength: 500
        category:
          type: string
          enum:
          - preference
          - person
          - event
          - goal
      required:
      - id
      - text
      - category
    Draft:
      type: object
      additionalProperties: false
      properties:
        session_id: *id001
        version: *id010
        expires_at: *id013
        mood: &id015
          type: string
          enum:
          - very_low
          - low
          - neutral
          - good
          - very_good
          - unknown
        topic:
          type: string
          minLength: 0
          maxLength: 160
        reflection:
          type: string
          minLength: 0
          maxLength: 3000
        insights:
          type: array
          items:
            type: string
            minLength: 0
            maxLength: 300
          maxItems: 5
        support_status:
          type: string
          enum:
          - none
          - offered
          - requested
        memories:
          type: array
          items:
            $ref: '#/components/schemas/MemoryCandidate'
          maxItems: 10
      required:
      - session_id
      - version
      - expires_at
      - mood
      - topic
      - reflection
      - insights
      - support_status
      - memories
    SaveSelection:
      type: object
      additionalProperties: false
      properties:
        version: *id010
        save_journal: *id012
        save_mood: *id012
        mood: *id015
        memory_candidate_ids:
          type: array
          items: *id001
          maxItems: 10
          uniqueItems: true
      required:
      - version
      - save_journal
      - save_mood
      - mood
      - memory_candidate_ids
    SaveResult:
      type: object
      additionalProperties: false
      properties:
        journal_id:
          type:
          - string
          - 'null'
          format: uuid
        mood_id:
          type:
          - string
          - 'null'
          format: uuid
        memory_ids:
          type: array
          items: *id001
          maxItems: 10
        session_id: *id001
      required:
      - journal_id
      - mood_id
      - memory_ids
      - session_id
    MoodEntry:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        created_at: *id013
        updated_at: *id013
        version: *id010
        label: *id015
        source:
          type: string
          enum:
          - check_in
          - conversation
        occurred_at: *id013
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - id
      - created_at
      - updated_at
      - version
      - label
      - source
      - occurred_at
      - timezone
    MoodCreate:
      type: object
      additionalProperties: false
      properties:
        label: *id015
        occurred_at: *id013
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - label
      - occurred_at
      - timezone
    MoodUpdate:
      type: object
      additionalProperties: false
      properties:
        label: *id015
        version: *id010
      required:
      - label
      - version
    Journal:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        created_at: *id013
        updated_at: *id013
        version: *id010
        topic:
          type: string
          minLength: 0
          maxLength: 160
        reflection:
          type: string
          minLength: 0
          maxLength: 3000
        insights:
          type: array
          items:
            type: string
            minLength: 0
            maxLength: 300
          maxItems: 5
        session_id:
