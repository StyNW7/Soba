services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soba
      POSTGRES_USER: soba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soba-dev-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - soba-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soba -d soba"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5174}
      ALLOWED_WEB_ORIGINS: ${ALLOWED_WEB_ORIGINS:-http://localhost:5174}
      DATABASE_URL: postgres://soba:${POSTGRES_PASSWORD:-soba-dev-password}@postgres:5432/soba?sslmode=disable
      POLICY_VERSION: ${POLICY_VERSION:-pilot-v1}
      POLICY_PUBLISHED_AT: ${POLICY_PUBLISHED_AT:-2026-09-07T00:00:00Z}
      DATA_KEY_VERSION: ${DATA_KEY_VERSION:-1}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      CURSOR_HMAC_KEY: ${CURSOR_HMAC_KEY:?Set CURSOR_HMAC_KEY in .env}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?Set AUDIT_HMAC_KEY in .env}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      MOBILE_RETURN_URI: ${MOBILE_RETURN_URI:-}
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      TEXT_PROVIDER: ${TEXT_PROVIDER:-openai}
      KOKORO_TTS_URL: ${KOKORO_TTS_URL:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      TEXT_MODEL: ${TEXT_MODEL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      CONTENT_PACK_PATH: ${CONTENT_PACK_PATH:-}
      OBJECT_DIRECTORY: /app/private-data
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      PROVIDER_DELETION_REQUIRED: ${PROVIDER_DELETION_REQUIRED:-false}
      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-10}
      MINOR_ENROLLMENT_ENABLED: ${MINOR_ENROLLMENT_ENABLED:-false}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - soba-private-data:/app/private-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/soba-migrate"]
    environment:
      DATABASE_URL: postgres://soba:${POSTGRES_PASSWORD:-soba-dev-password}@postgres:5432/soba?sslmode=disable

volumes:
  soba-postgres:
  soba-private-data:
