name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Widen per job only if something ever needs to write.
permissions:
  contents: read

# A new push to the same branch cancels the run it superseded, so we don't
# burn Actions minutes on results nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repo actually have code yet? The build jobs below stay
  # switched off until the module they cover exists, so CI is green on a repo
  # that is still mostly documentation. Each job turns itself on automatically
  # in the same PR that adds the module. Nobody has to remember to wire it up.
  detect:
    name: Detect modules
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f backend/go.mod ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/go.mod not found - skipping backend job"
          fi
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not found - skipping frontend job"
          fi

  docs:
    name: Docs and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No .env committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git. Remove it and rotate every key it held."
            exit 1
          fi
          echo "OK: no .env tracked"

      - name: Links resolve and no secrets in .env.example
        run: python3 scripts/check_docs.py

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soba
          POSTGRES_PASSWORD: soba-test-password
          POSTGRES_DB: soba_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U soba -d soba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOBA_TEST_DATABASE_URL: postgres://soba:soba-test-password@127.0.0.1:55432/soba_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          echo "OK: gofmt clean"

      - run: go vet ./...
      - run: go build ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go test ./... -race

  firmware-host:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S iot/host_tests -B iot/host_tests/build
      - name: Build
        run: cmake --build iot/host_tests/build --parallel
      - name: Test
        run: ctest --test-dir iot/host_tests/build --output-on-failure

  reprocontract:
    name: Reproduce API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validator dependencies
        run: python -m pip install -r docs/implementation/validation/requirements.txt
      - name: Validate specification
        run: python docs/implementation/validation/validate_spec.py
      - name: Regenerate runtime contract
        run: python scripts/generate_runtime_contract.py
      - name: Require generated contract to be committed
        run: git diff --exit-code -- backend/internal/httpapi/contract.json

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Works with either lockfile, so the first person to scaffold the app
      # does not land a red build just for picking pnpm over npm.
      - name: Pick package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: frontend/${{ steps.pm.outputs.manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install
        run: |
          if [ "${{ steps.pm.outputs.manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Each of these runs only if the script is actually defined, so the app
      # can land before its lint and test setup does.
      - name: Lint
        run: npm run --if-present lint

      - name: Typecheck
        run: npm run --if-present typecheck

      - name: Test
        run: npm run --if-present test

      - name: Build
        run: npm run --if-present build
